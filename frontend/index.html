<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

```
<div class="container">
    <h1>📚 AI Study Assistant</h1>
    <p class="subtitle">Ask questions about your study material</p>

    <div class="card">
        <label for="question">Your Question</label>

        <textarea
            id="question"
            placeholder="Ask a question..."
            rows="5"
        ></textarea>

        <button id="askButton">Ask AI</button>

        <div id="loading" class="loading hidden">
            Thinking...
        </div>

        <div id="answer" class="answer"></div>
    </div>

    <div class="card">
        <h2>📄 Upload Study Document</h2>

        <input type="file" id="documentFile" accept=".txt">

        <button id="uploadButton">Upload Document</button>

        <div id="uploadMessage"></div>
    </div>

    <div class="card">
        <h2>📖 Study History</h2>

        <button id="historyButton">Load History</button>

        <div id="history"></div>
    </div>
</div>

<script src="script.js"></script>
```

</body>
</html>
